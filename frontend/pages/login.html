<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — AI Study Assistant</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/pages.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-icon"><i class="fas fa-brain"></i></div>
      <h1 class="auth-title">Welcome Back!</h1>
      <p class="auth-sub">Sign in to continue your learning journey</p>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <div class="input-group-icon">
          <i class="fas fa-envelope"></i>
          <input type="email" id="email" class="form-control" placeholder="you@example.com" required>
        </div>
      </div>
      <div class="form-group">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <label class="form-label mb-0">Password</label>
          <a href="#" style="font-size:13px;color:#4f46e5;text-decoration:none">Forgot password?</a>
        </div>
        <div class="input-group-icon">
          <i class="fas fa-lock"></i>
          <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
          <i class="fas fa-eye toggle-pw" id="togglePw"></i>
        </div>
      </div>

      <div id="errorMsg" class="alert alert-danger d-none" role="alert"></div>

      <button type="submit" class="btn-primary w-100 justify-content-center" style="padding:12px">
        <i class="fas fa-sign-in-alt"></i> Sign In
      </button>
    </form>

    <div class="divider"><span>or try demo</span></div>

    <button class="btn-outline w-100 justify-content-center" onclick="loginDemo()" style="padding:11px">
      <i class="fas fa-flask"></i> Demo Login (No Account Needed)
    </button>

    <p style="text-align:center;margin-top:20px;font-size:14px;color:#64748b">
      Don't have an account? <a href="register.html" style="color:#4f46e5;font-weight:600;text-decoration:none">Sign up free</a>
    </p>
    <p style="text-align:center;margin-top:8px;font-size:13px">
      <a href="../index.html" style="color:#94a3b8;text-decoration:none"><i class="fas fa-arrow-left"></i> Back to Home</a>
    </p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/app.js"></script>
<script>
  if (Auth.isLoggedIn()) window.location.href = 'dashboard.html';

  document.getElementById('togglePw').addEventListener('click', function() {
    const pw = document.getElementById('password');
    pw.type = pw.type === 'password' ? 'text' : 'password';
    this.classList.toggle('fa-eye');
    this.classList.toggle('fa-eye-slash');
  });

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('button[type="submit"]');
    const errDiv = document.getElementById('errorMsg');
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing In...';
    btn.disabled = true;
    errDiv.classList.add('d-none');

    const res = await api.post('/auth/login', {
      email: document.getElementById('email').value,
      password: document.getElementById('password').value
    });

    if (res && res.success) {
      Auth.setAuth(res.token, res.user);
      window.location.href = 'dashboard.html';
    } else {
      errDiv.textContent = res?.message || 'Login failed. Please try again.';
      errDiv.classList.remove('d-none');
      btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
      btn.disabled = false;
    }
  });

  async function loginDemo() {
    // Try to login with demo credentials, create if not exists
    let res = await api.post('/auth/login', { email: 'demo@student.com', password: 'demo1234' });
    if (!res || !res.success) {
      res = await api.post('/auth/register', { name: 'Demo Student', email: 'demo@student.com', password: 'demo1234', college: 'Demo University', semester: '5th' });
    }
    if (res && res.success) {
      Auth.setAuth(res.token, res.user);
      window.location.href = 'dashboard.html';
    } else {
      // Offline demo mode
      Auth.setAuth('demo_token', { id: 'demo', name: 'Demo Student', email: 'demo@student.com', college: 'Demo University', studyStreak: 7 });
      window.location.href = 'dashboard.html';
    }
  }
</script>
</body>
</html>
